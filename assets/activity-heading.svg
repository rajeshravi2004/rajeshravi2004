<svg width="1000" height="385" viewBox="0 0 1000 385" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Professional activity</title>
  <desc id="desc">Rajesh works daily on production healthcare software in private company repositories through a separate work account, while this profile presents selected personal projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#090D20"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <radialGradient id="orb"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect x="1" y="1" width="998" height="383" rx="20" fill="url(#bg)" stroke="#1E3A5F"/>
