<svg width="480" height="210" viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Zoro's Shop</title><desc id="desc">Project card for an AI-powered e-commerce platform.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211006"/><stop offset="1" stop-color="#11101F"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="10"/></filter></defs>
  <rect x="1" y="1" width="478" height="208" rx="18" fill="url(#bg)" stroke="#FB923C" stroke-opacity=".38"/>
  <circle cx="421" cy="38" r="45" fill="#FB923C" opacity=".12" filter="url(#g)"><animate attributeName="opacity" values=".08;.24;.08" dur="3.2s" repeatCount="indefinite"/></circle>
  <text x="28" y="42" fill="#FDBA74" font-family="Segoe UI, Arial" font-size="11" font-weight="700" letter-spacing="2">04 / AI + COMMERCE</text>
  <text x="28" y="78" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="23" font-weight="750">Zoro's Shop</text>
  <text x="28" y="109" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="13">E-commerce with secure payments, vector</text>
  <text x="28" y="128" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="13">search, and a voice-enabled AI assistant.</text>
  <g font-family="Segoe UI, Arial" font-size="10" font-weight="600"><text x="28" y="167" fill="#CBD5E1">DJANGO</text><text x="84" y="167" fill="#CBD5E1">GEMINI</text><text x="140" y="167" fill="#CBD5E1">FAISS</text><text x="183" y="167" fill="#CBD5E1">STRIPE</text></g>
  <text x="28" y="193" fill="#FB923C" font-family="Segoe UI, Arial" font-size="11" font-weight="700">VIEW PROJECT  →</text>
</svg>
