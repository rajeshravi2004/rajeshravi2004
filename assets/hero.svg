<svg width="1000" height="400" viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rajesh R — Full Stack Developer</title>
  <desc id="desc">Animated midnight blue profile banner for Rajesh R, a full stack developer building AI-powered healthcare products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#030712"/><stop offset=".52" stop-color="#071225"/><stop offset="1" stop-color="#120A25"/></linearGradient>
    <linearGradient id="brand" x1="260" y1="80" x2="740" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8F9"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#22D3EE" stop-opacity=".38"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#38BDF8" stroke-opacity=".065"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1000" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="400" fill="url(#bg)"/><rect width="1000" height="400" fill="url(#grid)"/>
    <circle cx="95" cy="90" r="240" fill="url(#cyan)"><animate attributeName="r" values="205;255;205" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="915" cy="310" r="250" fill="url(#violet)"><animate attributeName="r" values="250;205;250" dur="9s" repeatCount="indefinite"/></circle>
    <path d="M-40 310C185 230 286 354 505 262S798 160 1050 220" stroke="#22D3EE" stroke-opacity=".26" stroke-dasharray="9 18"><animate attributeName="stroke-dashoffset" values="0;-270" dur="10s" repeatCount="indefinite"/></path>
    <path d="M-30 337C185 273 309 380 530 292S820 188 1030 246" stroke="#A78BFA" stroke-opacity=".2" stroke-dasharray="4 17"><animate attributeName="stroke-dashoffset" values="0;250" dur="12s" repeatCount="indefinite"/></path>
    <g fill="#67E8F9"><circle cx="85" cy="208" r="2"><animate attributeName="opacity" values=".15;1;.15" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="184" cy="62" r="1.5"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle><circle cx="858" cy="80" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="932" cy="220" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="3.5s" repeatCount="indefinite"/></circle></g>
    <rect x="34" y="28" width="172" height="30" rx="15" fill="#081322" stroke="#22D3EE" stroke-opacity=".45"/><circle cx="54" cy="43" r="5" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="69" y="48" fill="#A7F3D0" font-family="Segoe UI, Arial" font-size="11" font-weight="700" letter-spacing="1.2">AVAILABLE FOR WORK</text>
    <text x="500" y="121" text-anchor="middle" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="15" font-weight="600" letter-spacing="5">HELLO, I AM</text>
    <text x="500" y="198" text-anchor="middle" fill="url(#brand)" font-family="Segoe UI, Arial" font-size="74" font-weight="800" letter-spacing="5" filter="url(#glow)">RAJESH R</text>
    <text x="500" y="239" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="18" font-weight="650" letter-spacing="3.2">FULL STACK DEVELOPER</text>
    <g text-anchor="middle" font-family="Segoe UI, Arial" font-size="15" font-weight="500" letter-spacing="1">
      <text x="500" y="286" fill="#7DD3FC">Building AI-powered healthcare products<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.27;.33;.93;.94;.99;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="500" y="286" fill="#C4B5FD" opacity="0">Engineering secure real-time systems<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.27;.33;.60;.66;1" dur="9s" repeatCount="indefinite"/></text>
      <text x="500" y="286" fill="#7DD3FC" opacity="0">Turning complex workflows into simple experiences<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.60;.66;.93;1" dur="9s" repeatCount="indefinite"/></text>
    </g>
    <g font-family="Segoe UI, Arial" font-size="10" font-weight="700" letter-spacing="1"><g transform="translate(308 333)"><rect width="116" height="29" rx="14.5" fill="#071A26" stroke="#22D3EE" stroke-opacity=".35"/><text x="58" y="19" text-anchor="middle" fill="#67E8F9">FULL STACK</text></g><g transform="translate(442 333)"><rect width="116" height="29" rx="14.5" fill="#0E1528" stroke="#64748B" stroke-opacity=".35"/><text x="58" y="19" text-anchor="middle" fill="#CBD5E1">HEALTHCARE</text></g><g transform="translate(576 333)"><rect width="116" height="29" rx="14.5" fill="#160D2C" stroke="#A78BFA" stroke-opacity=".38"/><text x="58" y="19" text-anchor="middle" fill="#C4B5FD">AI SYSTEMS</text></g></g>
    <rect y="0" width="420" height="2" fill="url(#brand)"><animate attributeName="x" values="-420;1000" dur="4.5s" repeatCount="indefinite"/></rect>
  </g>
  <rect x=".5" y=".5" width="999" height="399" rx="23.5" stroke="#38BDF8" stroke-opacity=".3"/>
</svg>
