<svg width="480" height="210" viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rajify Desktop Music Player</title><desc id="desc">Project card for a Spotify-inspired desktop music player.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061521"/><stop offset="1" stop-color="#0B1026"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="10"/></filter></defs>
  <rect x="1" y="1" width="478" height="208" rx="18" fill="url(#bg)" stroke="#22D3EE" stroke-opacity=".35"/>
  <circle cx="421" cy="38" r="45" fill="#22D3EE" opacity=".12" filter="url(#g)"><animate attributeName="opacity" values=".08;.24;.08" dur="2.8s" repeatCount="indefinite"/></circle>
  <text x="28" y="42" fill="#67E8F9" font-family="Segoe UI, Arial" font-size="11" font-weight="700" letter-spacing="2">03 / DESKTOP + MUSIC</text>
  <text x="28" y="78" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="23" font-weight="750">Rajify Music Player</text>
  <text x="28" y="109" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="13">Discover, organize, and play music in a</text>
  <text x="28" y="128" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="13">polished Spotify-inspired desktop app.</text>
  <g font-family="Segoe UI, Arial" font-size="10" font-weight="600"><text x="28" y="167" fill="#CBD5E1">REACT 19</text><text x="91" y="167" fill="#CBD5E1">ELECTRON</text><text x="162" y="167" fill="#CBD5E1">VITE</text><text x="199" y="167" fill="#CBD5E1">YOUTUBE API</text></g>
  <text x="28" y="193" fill="#22D3EE" font-family="Segoe UI, Arial" font-size="11" font-weight="700">VIEW PROJECT  →</text>
</svg>
